<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="최신 AI 뉴스를 확인하고 필요한 기술정보를 검색하세요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Concepts — 뉴스와 기술정보">
  <meta property="og:description" content="최신 AI 뉴스와 검색으로 찾는 기술 문서.">
  <meta name="theme-color" content="#08101c">
  <title>AI Concepts — 뉴스와 기술정보</title>
  <link rel="stylesheet" href="style.css?v=20261026">
</head>
<body class="home-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="AI Concepts 첫 화면"><span class="brand-mark" aria-hidden="true">✳</span><span>AI<span class="brand-light"> Concepts</span></span></a>
    <a class="benchmark-link" href="benchmarks.html">모델 성능 비교 <span aria-hidden="true">↗</span></a>
  </div></header>
  <main id="main" class="shell home-main">
    <h1 class="sr-only">AI 뉴스와 기술정보</h1>
    <div class="content-tabs" role="tablist" aria-label="콘텐츠 선택">
      <button id="tab-news" type="button" role="tab" aria-selected="true" aria-controls="news">뉴스</button>
      <button id="tab-library" type="button" role="tab" aria-selected="false" aria-controls="library" tabindex="-1">기술정보</button>
    </div>
    <section id="news" class="content-panel" role="tabpanel" aria-labelledby="tab-news" tabindex="0">
      <h2 class="sr-only">뉴스</h2>
      <div class="news-tools">
        <span id="news-date" class="content-meta" role="status"></span>
        <label class="date-picker"><span class="sr-only">뉴스 날짜 선택</span><select id="news-day" disabled><option value="-1">최근 뉴스</option></select></label>
      </div>
      <div id="news-body" class="news-grid" aria-busy="true"><p class="loading" role="status">뉴스를 불러오는 중…</p></div>
    </section>
    <section id="library" class="content-panel" role="tabpanel" aria-labelledby="tab-library" tabindex="0" hidden>
      <h2 class="sr-only">기술정보</h2>
      <div class="library-tools">
        <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><span class="sr-only">기술정보 검색</span><input id="doc-search" type="search" placeholder="기술정보 검색" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters" disabled>필터 <span aria-hidden="true">⌄</span></button>
      </div>
      <div id="filters" class="filters" aria-label="분야·주제 필터" hidden></div>
      <p id="docs-meta" class="content-meta" role="status"></p>
      <div id="docs-body" aria-busy="true"><p class="loading" role="status">기술정보를 불러오는 중…</p></div>
    </section>
  </main>
  <footer class="site-footer"><div class="shell footer-inner"><span>AI Concepts</span><a href="#main">맨 위로 ↑</a></div></footer>
  <script src="ai.js?v=20261026" defer></script>
</body>
</html>
